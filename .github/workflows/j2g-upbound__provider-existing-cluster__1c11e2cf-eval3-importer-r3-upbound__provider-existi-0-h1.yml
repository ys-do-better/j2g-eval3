name: j2g-importer-39c8eef0cc1a
env:
  RUNNING_IN_CI: j2g-redacted
  REPOSITORY_NAME: j2g-redacted
  REPOSITORY_OWNER: j2g-redacted
  DOCKER: j2g-redacted
  AWS: j2g-redacted

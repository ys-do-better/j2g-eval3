name: Jenkins Migration
env:
  BUILDS_DISCORD: j2g-redacted
  GITHUB_TOKEN: j2g-redacted
  GITLAB_TOKEN: j2g-redacted
  GITLAB_NAMESPACE: j2g-redacted
  DOCKERHUB_TOKEN: j2g-redacted
  QUAYIO_API_TOKEN: j2g-redacted
  GIT_SIGNING_KEY: j2g-redacted
  EXT_GIT_BRANCH: j2g-redacted
  EXT_USER: j2g-redacted
  EXT_REPO: j2g-redacted
  BUILD_VERSION_ARG: j2g-redacted
  LS_USER: j2g-redacted
  LS_REPO: j2g-redacted
  CONTAINER_NAME: j2g-redacted
  DOCKERHUB_IMAGE: j2g-redacted
  DEV_DOCKERHUB_IMAGE: j2g-redacted
  PR_DOCKERHUB_IMAGE: j2g-redacted
  DIST_IMAGE: j2g-redacted
  MULTIARCH: j2g-redacted
  CI: j2g-redacted
  CI_WEB: j2g-redacted
  CI_PORT: j2g-redacted
  CI_SSL: j2g-redacted
  CI_DELAY: j2g-redacted
  CI_DOCKERENV: j2g-redacted
  CI_AUTH: j2g-redacted
  CI_WEBPATH: j2g-redacted
  PACKAGE_CHECK: ${{ inputs.PACKAGE_CHECK || 'false' }}
  J2G_RUN_ID: linuxserver__docker-nzbhydra2__961e41e9-eval3-differential-llm-t0-f5346bf73ee7-diffonly-0
  J2G_SCENARIO_ID: linuxserver__docker-nzbhydra2__961e41e9-eval3-differential-llm-t0-f5346bf73ee7-diffonly-0
  J2G_FAULTS: docker_push_single
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - uses: actions/checkout@v4
    - name: Set git config
      run: j2g_op set_git_config
    - name: Create Bash Function
      run: j2g_op create_bash_function
    - name: Set ENV Variables base
      run: j2g_op set_env_variables_base
    - name: Set Package tag
      run: j2g_op set_package_tag
    - name: Set ENV github_stable
      run: j2g_op set_env_github_stable
    - name: Set ENV github_link
      run: j2g_op set_env_github_link
    - name: Sanitize tag
      run: j2g_op sanitize_tag
    - name: Set ENV live build
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        }}
      run: j2g_op set_env_live_build
    - name: Set ENV dev build
      if: ${{ github.ref != 'refs/heads/master' && github.event_name != 'pull_request'
        }}
      run: j2g_op set_env_dev_build
    - name: Set ENV PR build
      if: ${{ github.event_name == 'pull_request' }}
      run: j2g_op set_env_pr_build
    - name: ShellCheck
      if: ${{ env.CI == 'true' }}
      run: j2g_op shellcheck
    - name: Update-Templates
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        && env.CONTAINER_NAME != null }}
      run: j2g_op update_templates
    - name: Template-exit
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        && env.FILES_UPDATED == 'true' && env.CONTAINER_NAME != null }}
      run: j2g_op template_exit
    - name: Check S6 Service file Permissions
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        && env.EXIT_STATUS == '' }}
      run: j2g_op check_s6_service_file_permissions
    - name: GitLab Mirror and Quay.io Visibility
      if: ${{ env.EXIT_STATUS == '' }}
      run: j2g_op gitlab_mirror_and_quay_io_visibility
    - name: Build-Single
      if: ${{ (env.MULTIARCH == 'false' || env.PACKAGE_CHECK == 'true') && env.EXIT_STATUS
        == '' }}
      run: j2g_op build_single
    - name: Build-Multi
      if: ${{ env.MULTIARCH == 'true' && env.PACKAGE_CHECK == 'false' && env.EXIT_STATUS
        == '' }}
      shell: bash
      run: "j2g_op build_x86 &\np1=$!\nj2g_op build_arm64 &\np2=$!\nwait -n\nstatus=$?\n\
        if [ $status -ne 0 ]; then\n  kill $p1 $p2 2>/dev/null || true\n  wait $p1\
        \ 2>/dev/null || true\n  wait $p2 2>/dev/null || true\n  exit $status\nfi\n\
        if kill -0 $p1 2>/dev/null; then\n  wait $p1\n  exit $?\nelse\n  wait $p2\n\
        \  exit $?\nfi\n"
    - name: Update-packages
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        && env.EXIT_STATUS == '' }}
      run: j2g_op update_packages
    - name: PACKAGE-exit
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        && env.PACKAGE_UPDATED == 'true' && env.EXIT_STATUS == '' }}
      run: j2g_op package_exit
    - name: PACKAGECHECK-exit
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        && env.PACKAGE_UPDATED == 'false' && env.EXIT_STATUS == '' && env.PACKAGE_CHECK
        == 'true' }}
      run: j2g_op packagecheck_exit
    - name: Test
      if: ${{ env.CI == 'true' && env.EXIT_STATUS == '' }}
      run: j2g_op test
    - name: Docker-Push-Single
      if: ${{ env.MULTIARCH == 'false' && env.EXIT_STATUS == '' }}
      run: j2g_op docker_push_single
    - name: Docker-Push-Multi
      if: ${{ env.MULTIARCH == 'true' && env.EXIT_STATUS == '' }}
      run: j2g_op docker_push_multi
    - name: Github-Tag-Push-Release
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        && env.LS_RELEASE != format('{0}-ls{1}', env.EXT_RELEASE_CLEAN, env.LS_TAG_NUMBER)
        && env.EXIT_STATUS == '' }}
      run: j2g_op github_tag_push_release
    - name: Github-Release-Branch-Protection
      if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        && env.EXIT_STATUS == '' }}
      run: j2g_op github_release_branch_protection
    - name: Post always
      if: always()
      run: j2g_op post_always
    - name: Post cleanup
      if: always()
      run: j2g_op post_cleanup
'on':
  workflow_dispatch:
    inputs:
      PACKAGE_CHECK:
        description: package check run
        required: false
        default: 'false'
        type: string

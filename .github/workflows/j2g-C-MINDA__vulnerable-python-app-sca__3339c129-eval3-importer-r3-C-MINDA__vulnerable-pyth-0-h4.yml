name: j2g-importer-41091b100c30
env:
  TRIVY_VERSION: j2g-redacted
  APP_NAME: j2g-redacted
  APP_VERSION: j2g-redacted
  DOCKER_IMAGE: j2g-redacted
  MAX_CRITICAL: j2g-redacted
  MAX_HIGH: j2g-redacted
  MAX_MEDIUM: j2g-redacted
  J2G_RUN_ID: C-MINDA__vulnerable-python-app-sca__3339c129-eval3-importer-r3-C-MINDA__vulnerable-pyth-0-h4
  J2G_SCENARIO_ID: C-MINDA__vulnerable-python-app-sca__3339c129-eval3-importer-r3-C-MINDA__vulnerable-pyth-0-h4
  J2G_FAULTS: post_always
jobs:
  Checkout:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op checkout
  Build_Application:
    name: Build Application
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op build_application
  Test_Application:
    name: Test Application
    runs-on: ubuntu-latest
    needs: Build_Application
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op test_application
    - name: sh
      shell: bash
      run: j2g_op test_application_post_always
      if: always()
  Trivy_Security_Scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: Test_Application
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op trivy_security_scan
  Security_Gate_Evaluate_Thresholds:
    name: Security Gate - Evaluate Thresholds
    runs-on: ubuntu-latest
    needs: Trivy_Security_Scan
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op security_gate_evaluate_thresholds
  Generate_HTML_Report:
    name: Generate HTML Report
    runs-on: ubuntu-latest
    needs: Security_Gate_Evaluate_Thresholds
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op generate_html_report
  Archive_Reports_Publish:
    name: Archive Reports & Publish
    runs-on: ubuntu-latest
    needs: Generate_HTML_Report
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op archive_reports_publish --writes trivy-reports/*
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Checkout
    - Build_Application
    - Test_Application
    - Trivy_Security_Scan
    - Security_Gate_Evaluate_Thresholds
    - Generate_HTML_Report
    - Archive_Reports_Publish
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: snapshot post build workflow status
      run: 'echo "success=${{ contains(needs.*.result,''success'') && !contains(needs.*.result,''cancelled'')
        && !contains(needs.*.result,''failure'') }}" >> $GITHUB_OUTPUT

        echo "failure=${{ contains(needs.*.result,''failure'') && !contains(needs.*.result,''cancelled'')
        }}" >> $GITHUB_OUTPUT'
      id: post_build
    - name: sh
      shell: bash
      run: j2g_op post_failure
      if: steps.post_build.outputs.failure == 'true'
    - name: sh
      shell: bash
      run: j2g_op post_success
      if: steps.post_build.outputs.success == 'true'
    - name: sh
      shell: bash
      run: j2g_op post_always
      if: always()
'on':
  workflow_dispatch: null

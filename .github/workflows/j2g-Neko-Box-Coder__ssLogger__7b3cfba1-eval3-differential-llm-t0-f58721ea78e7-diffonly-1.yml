name: ssLogger CI
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Setup
      run: j2g_op setup
  checkout:
    needs: setup
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      run: j2g_op checkout
    - name: Checkout post failure
      if: failure()
      run: j2g_op checkout_post_failure
  build:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Build
      run: j2g_op build
  test_linux_header_only:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Linux Header Only Test
      run: j2g_op linux_header_only_test
    - name: Linux Header Only Test post failure
      if: failure()
      run: j2g_op linux_header_only_test_post_failure
  test_linux_static:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Linux Static Test
      run: j2g_op linux_static_test
    - name: Linux Static Test post failure
      if: failure()
      run: j2g_op linux_static_test_post_failure
  test_linux_shared:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Linux Shared Test
      run: j2g_op linux_shared_test
    - name: Linux Shared Test post failure
      if: failure()
      run: j2g_op linux_shared_test_post_failure
  test_linux_log_to_file:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Linux Log To File Test
      run: j2g_op linux_log_to_file_test
    - name: Linux Log To File Test post failure
      if: failure()
      run: j2g_op linux_log_to_file_test_post_failure
  test_linux_log_to_both_console_file:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Linux Log To Both Console File Test
      run: j2g_op linux_log_to_both_console_file_test
    - name: Linux Log To Both Console File Test post failure
      if: failure()
      run: j2g_op linux_log_to_both_console_file_test_post_failure
  test_windows_header_only:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Windows Header Only Test
      run: j2g_op windows_header_only_test
    - name: Windows Header Only Test post failure
      if: failure()
      run: j2g_op windows_header_only_test_post_failure
  test_windows_static:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Windows Static Test
      run: j2g_op windows_static_test
    - name: Windows Static Test post failure
      if: failure()
      run: j2g_op windows_static_test_post_failure
  test_windows_shared:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Windows Shared Test
      run: j2g_op windows_shared_test
    - name: Windows Shared Test post failure
      if: failure()
      run: j2g_op windows_shared_test_post_failure
  test_windows_log_to_file:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Windows Log To File Test
      run: j2g_op windows_log_to_file_test
    - name: Windows Log To File Test post failure
      if: failure()
      run: j2g_op windows_log_to_file_test_post_failure
  test_windows_both_console_file:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Windows Both Console File Test
      run: j2g_op windows_both_console_file_test
    - name: Windows Both Console File Test post failure
      if: failure()
      run: j2g_op windows_both_console_file_test_post_failure
  notify:
    needs:
    - test_linux_header_only
    - test_linux_static
    - test_linux_shared
    - test_linux_log_to_file
    - test_linux_log_to_both_console_file
    - test_windows_header_only
    - test_windows_static
    - test_windows_shared
    - test_windows_log_to_file
    - test_windows_both_console_file
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Notify
      run: j2g_op notify
  post_failure:
    needs:
    - setup
    - checkout
    - build
    - test_linux_header_only
    - test_linux_static
    - test_linux_shared
    - test_linux_log_to_file
    - test_linux_log_to_both_console_file
    - test_windows_header_only
    - test_windows_static
    - test_windows_shared
    - test_windows_log_to_file
    - test_windows_both_console_file
    - notify
    if: failure()
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Post failure
      run: j2g_op post_failure
env:
  J2G_RUN_ID: Neko-Box-Coder__ssLogger__7b3cfba1-eval3-differential-llm-t0-f58721ea78e7-diffonly-1
  J2G_SCENARIO_ID: Neko-Box-Coder__ssLogger__7b3cfba1-eval3-differential-llm-t0-f58721ea78e7-diffonly-1
  J2G_FAULTS: linux_shared_test_post_failure
'on':
  workflow_dispatch: null

name: j2g-importer-4fa24d6744f8
jobs:
  Setup:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op setup
  Checkout:
    runs-on: ubuntu-latest
    needs: Setup
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: j2g_op checkout
    - name: snapshot post build job status
      run: echo "failure=${{ job.status == 'failure' }}" >> $GITHUB_OUTPUT
      id: post_build
    - name: sh
      shell: bash
      run: j2g_op checkout_post_failure
      if: steps.post_build.outputs.failure == 'true'
  Build:
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
    - name: j2g-probe-install

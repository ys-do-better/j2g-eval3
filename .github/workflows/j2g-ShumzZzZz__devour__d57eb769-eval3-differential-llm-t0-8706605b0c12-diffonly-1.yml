name: CI
concurrency:
  group: j2g-ShumzZzZz__devour__d57eb769-eval3-differential-llm-t0-8706605b0c12-diffonly-1-${{
    github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Determine changed files
      id: changes
      shell: bash
      run: "set -euo pipefail\nif [[ \"${{ github.event_name }}\" == \"pull_request\"\
        \ ]]; then\n  base=\"${{ github.event.pull_request.base.sha }}\"\n  head=\"\
        ${{ github.event.pull_request.head.sha }}\"\n  changed=$(git diff --name-only\
        \ \"$base\" \"$head\" || true)\nelif [[ \"${{ github.event_name }}\" == \"\
        push\" ]]; then\n  before=\"${{ github.event.before }}\"\n  after=\"${{ github.sha\
        \ }}\"\n  if [[ \"$before\" =~ ^0+$ ]]; then\n    changed=$(git diff --name-only\
        \ \"$after^\" \"$after\" || true)\n  else\n    changed=$(git diff --name-only\
        \ \"$before\" \"$after\" || true)\n  fi\nelse\n  changed=$(git diff --name-only\
        \ HEAD^ HEAD || true)\nfi\nif echo \"$changed\" | grep -q '^devour_feature_store/';\
        \ then\n  echo \"deploy_changed=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo\
        \ \"deploy_changed=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Lint / Ruff
      id: lint_ruff
      if: ${{ github.event_name == 'pull_request' }}
      env:
        LINT_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op lint_ruff --writes lint-report.txt,ruff.sarif
    - name: Lint / Ruff (post)
      id: lint_ruff_post
      if: ${{ always() && steps.lint_ruff.outcome != 'skipped' }}
      env:
        LINT_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op lint_ruff_post_always
    - name: Format / Ruff
      id: format_ruff
      if: ${{ github.event_name == 'pull_request' }}
      env:
        FORMAT_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op format_ruff --writes ruff-format-report.txt
    - name: Format / Ruff (post)
      id: format_ruff_post
      if: ${{ always() && steps.format_ruff.outcome != 'skipped' }}
      env:
        FORMAT_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op format_ruff_post_always
    - name: Format / Ruff (Main Auto-fix)
      id: format_ruff_main_auto_fix
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name
        == 'workflow_dispatch') }}
      env:
        FORMAT_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op format_ruff_main_auto_fix --writes ruff-autofix-summary.txt,ruff-format-autofix.diff
    - name: Format / Ruff (Main Auto-fix) (post)
      id: format_ruff_main_auto_fix_post
      if: ${{ always() && steps.format_ruff_main_auto_fix.outcome != 'skipped' }}
      env:
        FORMAT_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op format_ruff_main_auto_fix_post_always
    - name: Type Check / Pyright
      id: type_check_pyright
      if: ${{ github.event_name == 'pull_request' }}
      env:
        TYPECHECK_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op type_check_pyright --writes pyright-report.txt,pyright.json,pyright.sarif
    - name: Type Check / Pyright (post)
      id: type_check_pyright_post
      if: ${{ always() && steps.type_check_pyright.outcome != 'skipped' }}
      env:
        TYPECHECK_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op type_check_pyright_post_always
    - name: Unit Tests / PyTest
      id: unit_tests_pytest
      if: ${{ false }}
      env:
        TEST_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op unit_tests_pytest --writes pytest-report.txt,pytest.xml
    - name: Unit Tests / PyTest (post)
      id: unit_tests_pytest_post
      if: ${{ always() && steps.unit_tests_pytest.outcome != 'skipped' }}
      env:
        TEST_PATH: j2g-redacted
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op unit_tests_pytest_post_always
    - name: Quality - Other / pre-commit
      id: quality_other_pre_commit
      if: ${{ false }}
      env:
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op quality_other_pre_commit --writes pre-commit-report.txt,pre-commit-pyright-snippet.txt
    - name: Quality - Other / pre-commit (post)
      id: quality_other_pre_commit_post
      if: ${{ always() && steps.quality_other_pre_commit.outcome != 'skipped' }}
      env:
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op quality_other_pre_commit_post_always
    - name: PR CI Gate
      run: j2g_op pr_ci_gate
    - name: Docker Build & Push
      id: docker_build_push
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name
        == 'workflow_dispatch') && steps.changes.outputs.deploy_changed == 'true'
        }}
      env:
        BASE_IMAGE: j2g-redacted
        DOCKERHUB_REPO: j2g-redacted
      run: j2g_op docker_build_push --writes docker-build.txt
    - name: Docker Build & Push (post)
      id: docker_build_push_post
      if: ${{ always() && steps.docker_build_push.outcome != 'skipped' }}
      env:
        BASE_IMAGE: j2g-redacted
        DOCKERHUB_REPO: j2g-redacted
      run: j2g_op docker_build_push_post_always
    - name: Security Scan
      id: security_scan
      if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name
        == 'workflow_dispatch') && steps.changes.outputs.deploy_changed == 'true'
        }}
      env:
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op security_scan --writes trivy.sarif,sbom.cdx.json,bandit.sarif,pip-audit.cdx.json
    - name: Security Scan (post)
      id: security_scan_post
      if: ${{ always() && steps.security_scan.outcome != 'skipped' }}
      env:
        GITHUB_CONTEXT: j2g-redacted
      run: j2g_op security_scan_post_always
env:
  J2G_RUN_ID: ShumzZzZz__devour__d57eb769-eval3-differential-llm-t0-8706605b0c12-diffonly-1
  J2G_SCENARIO_ID: ShumzZzZz__devour__d57eb769-eval3-differential-llm-t0-8706605b0c12-diffonly-1
  J2G_FAULTS: lint_ruff
'on':
  workflow_dispatch: null

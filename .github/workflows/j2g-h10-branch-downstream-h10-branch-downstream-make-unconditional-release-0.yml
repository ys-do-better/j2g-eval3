name: migrated
'on':
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: build
      run: j2g_op build
  release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: release
      run: j2g_op release
  final:
    runs-on: ubuntu-latest
    needs:
    - build
    - release
    if: ${{ !failure() && !cancelled() }}
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - name: final
      run: j2g_op final
env:
  J2G_RUN_ID: h10-branch-downstream-h10-branch-downstream-make-unconditional-release-0
  J2G_SCENARIO_ID: h10-branch-downstream-h10-branch-downstream-make-unconditional-release-0
  J2G_FAULTS: ''

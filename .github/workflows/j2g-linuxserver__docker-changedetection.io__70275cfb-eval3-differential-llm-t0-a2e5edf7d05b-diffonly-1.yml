name: Jenkins Pipeline Migration
env:
  BUILDS_DISCORD: ${{ secrets.BUILDS_DISCORD }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  QUAYIO_API_TOKEN: ${{ secrets.QUAYIO_API_TOKEN }}
  GIT_SIGNING_KEY: ${{ secrets.GIT_SIGNING_KEY }}
  EXT_GIT_BRANCH: ${{ vars.EXT_GIT_BRANCH }}
  EXT_USER: ${{ vars.EXT_USER }}
  EXT_REPO: ${{ vars.EXT_REPO }}
  BUILD_VERSION_ARG: ${{ vars.BUILD_VERSION_ARG }}
  LS_USER: ${{ vars.LS_USER }}
  LS_REPO: ${{ vars.LS_REPO }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
  DEV_DOCKERHUB_IMAGE: ${{ vars.DEV_DOCKERHUB_IMAGE }}
  PR_DOCKERHUB_IMAGE: ${{ vars.PR_DOCKERHUB_IMAGE }}
  DIST_IMAGE: ${{ vars.DIST_IMAGE }}
  MULTIARCH: ${{ vars.MULTIARCH }}
  CI: ${{ vars.CI }}
  CI_WEB: ${{ vars.CI_WEB }}
  CI_PORT: ${{ vars.CI_PORT }}
  CI_SSL: ${{ vars.CI_SSL }}
  CI_DELAY: ${{ vars.CI_DELAY }}
  CI_DOCKERENV: ${{ vars.CI_DOCKERENV }}
  CI_AUTH: ${{ vars.CI_AUTH }}
  CI_WEBPATH: ${{ vars.CI_WEBPATH }}
  PACKAGE_CHECK: ${{ inputs.PACKAGE_CHECK || 'false' }}
  CHANGE_ID: ${{ github.event.pull_request.number || '' }}
  J2G_RUN_ID: linuxserver__docker-changedetection.io__70275cfb-eval3-differential-llm-t0-a2e5edf7d05b-diffonly-1
  J2G_SCENARIO_ID: linuxserver__docker-changedetection.io__70275cfb-eval3-differential-llm-t0-a2e5edf7d05b-diffonly-1
  J2G_FAULTS: docker_push_multi
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: j2g-probe-install
      env:
        J2G_OP_B64: 
      run: mkdir -p /tmp/j2g && printf "%s" "$J2G_OP_B64" | base64 -d > /tmp/j2g/j2g_op
        && chmod +x /tmp/j2g/j2g_op && echo /tmp/j2g >> "$GITHUB_PATH"
    - uses: actions/checkout@v4
    - name: Set git config
      run: j2g_op set_git_config
    - name: Create Bash Function
      run: j2g_op create_bash_function
    - name: Set ENV Variables base
      run: j2g_op set_env_variables_base
    - name: Set Package tag
      run: j2g_op set_package_tag
    - name: Set ENV github_stable
      run: j2g_op set_env_github_stable
    - name: Set ENV github_link
      run: j2g_op set_env_github_link
    - name: Sanitize tag
      run: j2g_op sanitize_tag
    - name: Set ENV live build
      if: github.ref == 'refs/heads/main' && env.CHANGE_ID == ''
      run: j2g_op set_env_live_build
    - name: Set ENV dev build
      if: github.ref != 'refs/heads/main' && env.CHANGE_ID == ''
      run: j2g_op set_env_dev_build
    - name: Set ENV PR build
      if: env.CHANGE_ID != ''
      run: j2g_op set_env_pr_build
    - name: ShellCheck
      if: env.CI == 'true'
      run: j2g_op shellcheck
    - name: Update-Templates
      if: github.ref == 'refs/heads/main' && env.CHANGE_ID == '' && env.CONTAINER_NAME
        != ''
      run: j2g_op update_templates
    - name: Template-exit
      if: github.ref == 'refs/heads/main' && env.CHANGE_ID == '' && env.FILES_UPDATED
        == 'true' && env.CONTAINER_NAME != ''
      run: j2g_op template_exit
    - name: Check S6 Service file Permissions
      if: github.ref == 'refs/heads/main' && env.CHANGE_ID == '' && env.EXIT_STATUS
        == ''
      run: j2g_op check_s6_service_file_permissions
    - name: GitLab Mirror and Quay.io Visibility
      if: env.EXIT_STATUS == ''
      run: j2g_op gitlab_mirror_and_quay_io_visibility
    - name: Build-Single
      if: (env.MULTIARCH == 'false' || env.PACKAGE_CHECK == 'true') && env.EXIT_STATUS
        == ''
      run: j2g_op build_single
    - name: Build X86
      if: env.MULTIARCH == 'true' && env.PACKAGE_CHECK == 'false' && env.EXIT_STATUS
        == ''
      run: j2g_op build_x86
    - name: Build ARM64
      if: env.MULTIARCH == 'true' && env.PACKAGE_CHECK == 'false' && env.EXIT_STATUS
        == ''
      run: j2g_op build_arm64
    - name: Update-packages
      if: github.ref == 'refs/heads/main' && env.CHANGE_ID == '' && env.EXIT_STATUS
        == ''
      run: j2g_op update_packages
    - name: PACKAGE-exit
      if: github.ref == 'refs/heads/main' && env.CHANGE_ID == '' && env.PACKAGE_UPDATED
        == 'true' && env.EXIT_STATUS == ''
      run: j2g_op package_exit
    - name: PACKAGECHECK-exit
      if: github.ref == 'refs/heads/main' && env.CHANGE_ID == '' && env.PACKAGE_UPDATED
        == 'false' && env.EXIT_STATUS == '' && env.PACKAGE_CHECK == 'true'
      run: j2g_op packagecheck_exit
    - name: Test
      if: env.CI == 'true' && env.EXIT_STATUS == ''
      run: j2g_op test
    - name: Docker-Push-Single
      if: env.MULTIARCH == 'false' && env.EXIT_STATUS == ''
      run: j2g_op docker_push_single
    - name: Docker-Push-Multi
      if: env.MULTIARCH == 'true' && env.EXIT_STATUS == ''
      run: j2g_op docker_push_multi
    - name: Github-Tag-Push-Release
      if: ${{ github.ref == 'refs/heads/main' && env.LS_RELEASE != format('{0}-ls{1}',
        env.EXT_RELEASE_CLEAN, env.LS_TAG_NUMBER) && env.CHANGE_ID == '' && env.EXIT_STATUS
        == '' }}
      run: j2g_op github_tag_push_release
    - name: Github-Release-Branch-Protection
      if: github.ref == 'refs/heads/main' && env.CHANGE_ID == '' && env.EXIT_STATUS
        == ''
      run: j2g_op github_release_branch_protection
    - name: Post always
      if: always()
      run: j2g_op post_always
    - name: Post cleanup
      if: always()
      run: j2g_op post_cleanup
'on':
  workflow_dispatch:
    inputs:
      PACKAGE_CHECK:
        description: package check run
        required: false
        default: 'false'
        type: string
